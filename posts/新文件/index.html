<style>

:root {
  --term-black: #0a0a0a;
  --term-green: #00ff41;
  --term-dark-green: #003300;
  --term-amber: #ffb000;
  --term-dim-green: #00aa2a;
  --term-bg: #0a0a0a;
  --term-fg: #00ff41;
  --term-border: #00ff41;
  --term-card-bg: #0d0d0d;
  --term-muted: #00aa2a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
  background: var(--term-bg);
  color: var(--term-fg);
  line-height: 1.6;
  min-height: 100vh;
  position: relative;
}

body::after {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 9999;
  background: repeating-linear-gradient(
    0deg,
    rgba(0,0,0,0.15) 0px,
    rgba(0,0,0,0.15) 1px,
    transparent 1px,
    transparent 3px
  );
}

.blog-container {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 24px;
}

.blog-header {
  padding: 20px 0;
  border-bottom: 1px solid var(--term-dark-green);
}

.blog-header-site {
  color: var(--term-green);
  font-size: 14px;
  text-shadow: 0 0 8px rgba(0,255,65,0.5);
}

.blog-header-site::before {
  content: '$ ';
  color: var(--term-amber);
}

.blog-nav {
  display: flex;
  gap: 24px;
  margin-top: 12px;
}

.nav-link {
  color: var(--term-dim-green);
  text-decoration: none;
  font-size: 13px;
  cursor: pointer;
  transition: color 0.2s, text-shadow 0.2s;
  position: relative;
}

.nav-link::before {
  content: '> ';
  color: var(--term-amber);
  opacity: 0;
  transition: opacity 0.2s;
}

.nav-link:hover, .nav-link.active {
  color: var(--term-green);
  text-shadow: 0 0 8px rgba(0,255,65,0.5);
}

.nav-link:hover::before, .nav-link.active::before {
  opacity: 1;
}

.blog-view { display: none; }
.view-home { display: block; }

.blog-hero {
  padding: 40px 0 20px;
}

.hero-title {
  font-size: 28px;
  color: var(--term-green);
  text-shadow: 0 0 12px rgba(0,255,65,0.6);
  margin-bottom: 8px;
}

.hero-title::before {
  content: '# ';
  color: var(--term-amber);
}

.hero-description {
  color: var(--term-dim-green);
  font-size: 14px;
}

.hero-description::before {
  content: '// ';
  color: var(--term-muted);
}

.hero-cursor {
  display: inline-block;
  width: 10px;
  height: 18px;
  background: var(--term-green);
  animation: blink 1s step-end infinite;
  vertical-align: text-bottom;
  margin-left: 4px;
}

@keyframes blink {
  50% { opacity: 0; }
}

.card-grid {
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 24px 0;
}

.card {
  background: var(--term-card-bg);
  border: 1px solid var(--term-dark-green);
  border-left: 3px solid var(--term-green);
  padding: 20px 24px;
  text-decoration: none;
  color: inherit;
  display: block;
  transition: border-color 0.3s, box-shadow 0.3s;
  position: relative;
}

.card::before {
  content: '$ ';
  color: var(--term-amber);
  position: absolute;
  top: 20px;
  left: 8px;
  font-size: 12px;
  opacity: 0;
  transition: opacity 0.3s;
}

.card:hover {
  border-color: var(--term-green);
  box-shadow: 0 0 15px rgba(0,255,65,0.15), inset 0 0 15px rgba(0,255,65,0.03);
}

.card:hover::before {
  opacity: 1;
}

.card-title {
  font-size: 16px;
  color: var(--term-green);
  text-shadow: 0 0 6px rgba(0,255,65,0.3);
  margin-bottom: 6px;
  padding-left: 16px;
}

.card-date {
  color: var(--term-muted);
  font-size: 12px;
  padding-left: 16px;
  margin-bottom: 10px;
}

.card-date::before {
  content: '[';
  color: var(--term-dark-green);
}

.card-date::after {
  content: ']';
  color: var(--term-dark-green);
}

.card-excerpt {
  color: var(--term-dim-green);
  font-size: 13px;
  padding-left: 16px;
  line-height: 1.5;
}

.card-tags {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  padding-left: 16px;
  flex-wrap: wrap;
}

.tag {
  display: inline-block;
  padding: 2px 10px;
  border: 1px solid var(--term-dark-green);
  color: var(--term-green);
  font-size: 11px;
  border-radius: 0;
}

.tag::before {
  content: '--';
  color: var(--term-amber);
  margin-right: 4px;
  font-size: 10px;
}

.blog-archive {
  padding: 24px 0;
}

.archive-title {
  font-size: 20px;
  color: var(--term-green);
  text-shadow: 0 0 8px rgba(0,255,65,0.5);
  margin-bottom: 24px;
}

.archive-title::before {
  content: '$ ls -la /archive/';
  color: var(--term-amber);
  display: block;
  font-size: 14px;
  margin-bottom: 4px;
}

.archive-year {
  margin-bottom: 24px;
}

.archive-year-title {
  font-size: 16px;
  color: var(--term-amber);
  margin-bottom: 8px;
}

.archive-year-title::before {
  content: 'drwxr-xr-x  ';
  color: var(--term-dim-green);
  font-size: 12px;
}

.archive-item {
  padding: 4px 0 4px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
}

.archive-item::before {
  content: '-rw-r--r--  ';
  color: var(--term-muted);
  font-size: 11px;
}

.archive-item a {
  color: var(--term-green);
  text-decoration: none;
  transition: text-shadow 0.2s;
}

.archive-item a:hover {
  text-shadow: 0 0 8px rgba(0,255,65,0.5);
}

.archive-item-date {
  color: var(--term-muted);
  font-size: 12px;
}

.blog-tags {
  padding: 24px 0;
}

.tags-title {
  font-size: 20px;
  color: var(--term-green);
  text-shadow: 0 0 8px rgba(0,255,65,0.5);
  margin-bottom: 24px;
}

.tags-title::before {
  content: '$ grep -r . /tags/';
  color: var(--term-amber);
  display: block;
  font-size: 14px;
  margin-bottom: 4px;
}

.tag-cloud {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 32px;
}

.tag-cloud-item {
  padding: 4px 12px;
  border: 1px solid var(--term-dark-green);
  color: var(--term-green);
  font-size: 13px;
  cursor: pointer;
  text-decoration: none;
  transition: border-color 0.2s, text-shadow 0.2s;
}

.tag-cloud-item:hover {
  border-color: var(--term-green);
  text-shadow: 0 0 8px rgba(0,255,65,0.5);
}

.tag-posts-section { display: none; }
.tag-posts-section.active { display: block; }

.tag-posts-title {
  font-size: 16px;
  color: var(--term-amber);
  margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--term-dark-green);
}

.tag-post-item {
  padding: 6px 0;
  border-bottom: 1px dashed var(--term-dark-green);
  font-size: 13px;
}

.tag-post-item a {
  color: var(--term-green);
  text-decoration: none;
}

.tag-post-item a:hover {
  text-shadow: 0 0 8px rgba(0,255,65,0.5);
}

.tag-post-date {
  color: var(--term-muted);
  font-size: 12px;
  margin-left: 12px;
}

.blog-footer {
  padding: 24px 0;
  border-top: 1px solid var(--term-dark-green);
  margin-top: 40px;
  font-size: 12px;
  color: var(--term-muted);
}

.footer-sys-info {
  margin-bottom: 4px;
}

.footer-sys-info::before {
  content: 'SYSTEM> ';
  color: var(--term-amber);
}

.post-detail {
  max-width: 900px;
  margin: 0 auto;
  padding: 40px 24px;
}

.post-title {
  font-size: 24px;
  color: var(--term-green);
  text-shadow: 0 0 10px rgba(0,255,65,0.5);
  margin-bottom: 12px;
}

.post-title::before {
  content: '# ';
  color: var(--term-amber);
}

.post-meta {
  color: var(--term-muted);
  font-size: 13px;
  margin-bottom: 24px;
}

.post-meta::before {
  content: '/* ';
}

.post-meta::after {
  content: ' */';
}

.post-content {
  border-left: 2px solid var(--term-dark-green);
  padding-left: 20px;
}

.post-content h1::before { content: '# '; color: var(--term-amber); }
.post-content h2::before { content: '## '; color: var(--term-amber); }
.post-content h3::before { content: '### '; color: var(--term-amber); }

.post-content h1, .post-content h2, .post-content h3 {
  color: var(--term-green);
  text-shadow: 0 0 6px rgba(0,255,65,0.3);
  margin: 1.5em 0 0.8em;
}

.post-content p {
  margin-bottom: 1em;
  line-height: 1.7;
}

.post-content pre {
  background: #050505;
  border: 1px solid var(--term-dark-green);
  padding: 16px;
  overflow-x: auto;
  margin: 1em 0;
  font-size: 13px;
}

.post-content code {
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
  color: var(--term-green);
}

.post-content blockquote {
  border-left: 2px solid var(--term-amber);
  padding-left: 16px;
  color: var(--term-dim-green);
  margin: 1em 0;
}

.post-content blockquote::before {
  content: '> ';
  color: var(--term-amber);
}

.post-content a {
  color: var(--term-green);
  text-decoration: underline;
  text-underline-offset: 2px;
}

.post-content img {
  max-width: 100%;
  border: 1px solid var(--term-dark-green);
}

@keyframes termGlow {
  0%, 100% { text-shadow: 0 0 8px rgba(0,255,65,0.4); }
  50% { text-shadow: 0 0 16px rgba(0,255,65,0.7); }
}

.hero-title {
  animation: termGlow 3s ease-in-out infinite;
}

@keyframes termFadeIn {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}

.card {
  animation: termFadeIn 0.4s ease-out both;
}

.card:nth-child(2) { animation-delay: 0.08s; }
.card:nth-child(3) { animation-delay: 0.16s; }
.card:nth-child(4) { animation-delay: 0.24s; }

@media (max-width: 768px) {
  .blog-container { padding: 0 12px; }
  .hero-title { font-size: 20px; }
  .card { padding: 14px 16px; }
  .card-title { font-size: 14px; }
  .blog-nav { gap: 12px; flex-wrap: wrap; }
}



.post-body-layout { display: grid; grid-template-columns: 1fr 200px; gap: 32px; align-items: start; }
.post-toc { position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; padding: 12px 0; font-size: 0.85em; line-height: 1.6; }
.post-toc::-webkit-scrollbar { width: 3px; }
.post-toc::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.2); border-radius: 2px; }
.toc-title { font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted, #888); margin-bottom: 10px; font-size: 0.9em; }

.vote-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 2px solid var(--border-color, rgba(128,128,128,0.2)); border-radius: 24px; padding: 8px 18px; cursor: pointer; transition: all 0.25s ease; font-size: 14px; color: #888; font-family: inherit; }
.vote-btn:hover { border-color: var(--accent, #e74c3c); background: var(--accent-light, rgba(231,76,60,0.08)); transform: scale(1.05); }

.vote-icon { font-size: 18px; line-height: 1; }
.vote-count { font-weight: 600; min-width: 12px; text-align: center; }
.about-page { text-align: center; padding: 40px 20px; }
.about-avatar { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 24px; object-fit: cover; border: 3px solid var(--accent, #e74c3c); }
.about-name { font-size: 1.8em; font-weight: 700; margin-bottom: 16px; }
.about-bio { font-size: 1.05em; color: var(--text-muted, #888); line-height: 1.8; max-width: 600px; margin: 0 auto 32px; }
.about-skills { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 32px; }
.about-skill-tag { padding: 6px 16px; border-radius: 20px; background: var(--accent-light, rgba(231,76,60,0.08)); color: var(--accent, #e74c3c); font-size: 0.85em; font-weight: 500; }
.about-contact { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
.about-contact a { padding: 8px 20px; border-radius: 20px; background: var(--bg-card, rgba(128,128,128,0.05)); border: 1px solid var(--border-color, rgba(128,128,128,0.2)); font-size: 0.9em; color: var(--text-muted, #888); transition: all 0.2s; }
.friend-links-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.friend-link-card { display: flex; align-items: center; gap: 16px; padding: 20px 24px; border-radius: var(--radius, 12px); background: var(--bg-card, rgba(128,128,128,0.05)); border: 1px solid var(--border-color, rgba(128,128,128,0.2)); transition: all 0.25s; text-decoration: none; }
.friend-link-card:hover { border-color: var(--accent, #e74c3c); transform: translateY(-2px); }

.not-found-link { display: inline-flex; align-items: center; gap: 6px; padding: 10px 24px; border-radius: 24px; background: var(--accent-light, rgba(231,76,60,0.08)); color: var(--accent, #e74c3c); font-weight: 500; font-size: 0.95em; transition: all 0.2s; text-decoration: none; }
.not-found-link:hover { background: var(--accent, #e74c3c); color: #fff; }
.post-content pre { position: relative; }
.code-copy-btn { position: absolute; top: 8px; right: 8px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border-color, rgba(128,128,128,0.2)); background: var(--bg-card, rgba(128,128,128,0.05)); color: var(--text-muted, #888); font-size: 0.75em; font-family: inherit; cursor: pointer; opacity: 0; transition: all 0.2s ease; }
.post-content pre:hover .code-copy-btn { opacity: 1; }
.code-copy-btn:hover { border-color: var(--accent, #e74c3c); color: var(--accent, #e74c3c); background: var(--accent-light, rgba(231,76,60,0.08)); }
.code-copy-btn.copied { border-color: #22c55e; color: #22c55e; }

<script>
function handleVote(btn){
  var slug=btn.getAttribute('data-slug');
  var type=btn.getAttribute('data-type');
  var key='vote_'+slug;
  var cur=localStorage.getItem(key)||'';
  var section=btn.parentElement;
  var upBtn=section.querySelector('.vote-up');
  var downBtn=section.querySelector('.vote-down');
  var upCountEl=upBtn.querySelector('.vote-count');
  var downCountEl=downBtn.querySelector('.vote-count');
  if(cur===type){localStorage.removeItem(key);upBtn.classList.remove('active');downBtn.classList.remove('active');upCountEl.textContent='0';downCountEl.textContent='0';}
  else{localStorage.setItem(key,type);upBtn.classList.toggle('active',type==='up');downBtn.classList.toggle('active',type==='down');upCountEl.textContent=type==='up'?'1':'0';downCountEl.textContent=type==='down'?'1':'0';}
}
</script>
